[project]
name = "NIR_spectra_forensics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pandas", "numpy",  "matplotlib", "openpyxl", "fastparquet"]


#[project.scripts]
#Definiert ausführbare Befehle meiner Anwendung
#nimmt nur importierbare Funktionen, ein module reicht nicht "module.submodule:function"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

# src-layout with real package (Variant B): package prefix makes module origin
# explicit and prevents name collisions with third-party packages
[tool.setuptools.packages.find]
where = ["src"]



